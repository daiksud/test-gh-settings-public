name: Check probe workflow
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed workflow without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Go toolchain for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Verify preflight fails closed without a protected Environment
        run: python3 -B .github/scripts/test_probe.py -q
